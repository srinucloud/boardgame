name: boardgame CI
on:
  push:
    branches: ["main"]
jobs:
  
  compile:
    runs-on: Agent-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven Install
        run: maven install -y

      - name: Build with Maven
        run: mvn compile
